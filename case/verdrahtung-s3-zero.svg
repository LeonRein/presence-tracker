<svg xmlns="http://www.w3.org/2000/svg" width="960" height="780" viewBox="0 0 960 780" font-family="Helvetica, Arial, sans-serif">
  <style>
    .t   { font-size: 14px; fill: #222; }
    .h   { font-size: 15px; font-weight: bold; fill: #222; }
    .pin { font-size: 12px; fill: #fff; }
    .use { font-size: 12px; fill: #fff; font-weight: bold; }
    .off { font-size: 11px; fill: #999; }
    .n   { font-size: 12.5px; fill: #333; }
    .w   { fill: none; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    .stub{ fill: none; stroke-width: 3; stroke-linecap: round; }
    .tag { font-size: 13px; font-weight: bold; fill: #fff; }
  </style>
  <rect width="960" height="780" fill="#ffffff"/>

  <text x="30" y="36" font-size="20" font-weight="bold" fill="#222">Verdrahtung: LD2450 + LD2410C → ESP32-S3-Zero</text>
  <text x="30" y="58" class="t">Alles von vorne gesehen, so wie es im Gehäuse eingebaut ist (ESP: Bauteilseite nach vorne, USB-C unten).</text>

  <!-- ================= LD2450 (Vorderseite, Buchse hinten) ================= -->
  <text x="80" y="102" class="h">HLK-LD2450 – Vorderseite</text>
  <rect x="80" y="110" width="680" height="124" rx="8" fill="#1f5fa8"/>
  <!-- Antennen nur angedeutet -->
  <g fill="#c9a43a" opacity="0.35">
    <rect x="330" y="135" width="46" height="34" rx="3"/><rect x="400" y="135" width="46" height="34" rx="3"/>
    <rect x="470" y="135" width="46" height="34" rx="3"/><rect x="540" y="135" width="46" height="34" rx="3"/>
    <rect x="470" y="180" width="46" height="34" rx="3"/><rect x="540" y="180" width="46" height="34" rx="3"/>
  </g>
  <!-- Stiftleiste auf der Rückseite (links von vorne gesehen) -->
  <rect x="100" y="128" width="66" height="96" rx="3" fill="none" stroke="#fff" stroke-dasharray="4 3" opacity="0.6"/>
  <text x="176" y="160" class="pin" opacity="0.75">Stiftleiste (hinten)</text>
  <text x="176" y="176" class="pin" opacity="0.75">bleibt ungenutzt</text>
  <!-- JST-Buchse auf der Rückseite (rechts von vorne gesehen) -->
  <rect x="722" y="132" width="32" height="80" rx="3" fill="#f0f0f0" opacity="0.9" stroke="#999" stroke-dasharray="4 3"/>
  <circle cx="738" cy="145" r="5" fill="#d4af37"/>
  <circle cx="738" cy="165" r="5" fill="#d4af37"/>
  <circle cx="738" cy="185" r="5" fill="#d4af37"/>
  <circle cx="738" cy="205" r="5" fill="#d4af37"/>
  <text x="714" y="149" class="use" text-anchor="end">5V</text>
  <text x="714" y="169" class="use" text-anchor="end">RX</text>
  <text x="714" y="189" class="use" text-anchor="end">TX</text>
  <text x="714" y="209" class="use" text-anchor="end">GND</text>
  <text x="620" y="226" class="pin" opacity="0.75" text-anchor="end">JST-Buchse (hinten)</text>

  <!-- ================= ESP32-S3-Zero (USB-C unten) ================= -->
  <rect x="520" y="300" width="180" height="290" rx="8" fill="#1f4f8a"/>
  <rect x="570" y="575" width="80" height="34" rx="7" fill="#b9b9b9"/>
  <text x="610" y="597" font-size="12" fill="#222" text-anchor="middle">USB-C</text>
  <g fill="#d4af37">
    <circle cx="535" cy="325" r="6"/><circle cx="535" cy="355" r="6"/><circle cx="535" cy="385" r="6"/>
    <circle cx="535" cy="415" r="6"/><circle cx="535" cy="445" r="6"/><circle cx="535" cy="475" r="6"/>
    <circle cx="535" cy="505" r="6"/><circle cx="535" cy="535" r="6"/><circle cx="535" cy="565" r="6"/>
    <circle cx="685" cy="325" r="6"/><circle cx="685" cy="355" r="6"/><circle cx="685" cy="385" r="6"/>
    <circle cx="685" cy="415" r="6"/><circle cx="685" cy="445" r="6"/><circle cx="685" cy="475" r="6"/>
    <circle cx="685" cy="505" r="6"/><circle cx="685" cy="535" r="6"/><circle cx="685" cy="565" r="6"/>
  </g>
  <!-- linke Spalte (von oben): 7 8 9 10 11 12 13 RX TX -->
  <text x="550" y="329" class="use">GPIO7</text>
  <text x="550" y="359" class="use">GPIO8</text>
  <text x="550" y="389" class="use">GPIO9</text>
  <text x="550" y="419" class="pin" opacity="0.6">10</text>
  <text x="550" y="449" class="pin" opacity="0.6">11</text>
  <text x="550" y="479" class="pin" opacity="0.6">12</text>
  <text x="550" y="509" class="pin" opacity="0.6">13</text>
  <text x="550" y="539" class="pin" opacity="0.6">RX (44)</text>
  <text x="550" y="569" class="pin" opacity="0.6">TX (43)</text>
  <!-- rechte Spalte (von oben): 6 5 4 3 2 1 3V3 GND 5V -->
  <text x="670" y="329" class="use" text-anchor="end">GPIO6</text>
  <text x="670" y="359" class="pin" text-anchor="end" opacity="0.6">5</text>
  <text x="670" y="389" class="pin" text-anchor="end" opacity="0.6">4</text>
  <text x="670" y="419" class="pin" text-anchor="end" opacity="0.6">3 (frei lassen)</text>
  <text x="670" y="449" class="pin" text-anchor="end" opacity="0.6">2</text>
  <text x="670" y="479" class="pin" text-anchor="end" opacity="0.6">1</text>
  <text x="670" y="509" class="pin" text-anchor="end" opacity="0.6">3V3 (out)</text>
  <text x="670" y="539" class="use" text-anchor="end">GND</text>
  <text x="670" y="569" class="use" text-anchor="end">5V</text>
  <text x="520" y="633" class="h">ESP32-S3-Zero</text>
  <text x="520" y="651" class="n">Bauteilseite, USB-C unten</text>

  <!-- ================= LD2410C (Vorderseite) ================= -->
  <rect x="120" y="500" width="240" height="160" rx="8" fill="#1f5fa8"/>
  <circle cx="165" cy="520" r="6" fill="#d4af37"/>
  <circle cx="205" cy="520" r="6" fill="#d4af37"/>
  <circle cx="245" cy="520" r="6" fill="#d4af37"/>
  <circle cx="285" cy="520" r="6" fill="#d4af37"/>
  <circle cx="325" cy="520" r="6" fill="#d4af37"/>
  <text x="165" y="547" class="use" text-anchor="middle">TX</text>
  <text x="205" y="547" class="use" text-anchor="middle">RX</text>
  <text x="245" y="547" class="pin" text-anchor="middle" opacity="0.6">OUT</text>
  <text x="285" y="547" class="use" text-anchor="middle">GND</text>
  <text x="325" y="547" class="use" text-anchor="middle">VCC</text>
  <g fill="#c9a43a" opacity="0.35"><rect x="160" y="565" width="44" height="40" rx="3"/><rect x="280" y="565" width="44" height="40" rx="3"/></g>
  <text x="240" y="628" class="pin" text-anchor="middle">Stiftleiste auslöten, Litzen</text>
  <text x="240" y="644" class="pin" text-anchor="middle">von hinten in die Löcher löten</text>
  <text x="120" y="682" class="h">HLK-LD2410C – Vorderseite</text>
  <text x="120" y="700" class="n">(Lötseite hinten: Reihenfolge gespiegelt, VCC · GND · OUT · RX · TX)</text>

  <!-- ================= Signalleitungen ================= -->
  <!-- LD2450 RX <- GPIO6 (ESP sendet), rechte Spalte -->
  <path class="w" stroke="#2e9e44" d="M738,165 H830 V325 H685"/>
  <!-- LD2450 TX -> GPIO7 (ESP empfängt), linke Spalte: über den ESP hinweg -->
  <path class="w" stroke="#e8890c" d="M738,185 H800 V274 H500 V325 H535"/>
  <!-- LD2410C TX -> GPIO8 (ESP empfängt) -->
  <path class="w" stroke="#a03fc8" d="M165,520 V355 H535"/>
  <!-- LD2410C RX <- GPIO9 (ESP sendet) -->
  <path class="w" stroke="#2f6fe0" d="M205,520 V385 H535"/>
  <text x="520" y="266" class="n" fill="#e8890c">TX → GPIO7</text>
  <text x="840" y="345" class="n" fill="#2e9e44">RX ← GPIO6</text>
  <text x="300" y="349" class="n" fill="#a03fc8">TX → GPIO8</text>
  <text x="300" y="379" class="n" fill="#2f6fe0">RX ← GPIO9</text>

  <!-- ================= Versorgung (Netz-Marken) ================= -->
  <!-- LD2450 JST 5V / GND -->
  <path class="stub" stroke="#d62828" d="M738,145 V88"/>
  <rect x="716" y="70" width="44" height="20" rx="4" fill="#d62828"/>
  <text x="738" y="85" class="tag" text-anchor="middle">5V</text>
  <path class="stub" stroke="#222" d="M738,205 V242"/>
  <rect x="713" y="240" width="50" height="20" rx="4" fill="#222"/>
  <text x="738" y="255" class="tag" text-anchor="middle">GND</text>
  <!-- LD2410C GND / VCC -->
  <path class="stub" stroke="#222" d="M285,520 V478"/>
  <rect x="260" y="460" width="50" height="20" rx="4" fill="#222"/>
  <text x="285" y="475" class="tag" text-anchor="middle">GND</text>
  <path class="stub" stroke="#d62828" d="M325,520 V456"/>
  <rect x="315" y="436" width="44" height="20" rx="4" fill="#d62828"/>
  <text x="337" y="451" class="tag" text-anchor="middle">5V</text>
  <text x="245" y="492" class="off" text-anchor="middle">OUT frei</text>
  <!-- ESP 5V / GND: beim S3-Zero rechts unten -->
  <path class="stub" stroke="#222" d="M685,535 H742"/>
  <rect x="742" y="525" width="50" height="20" rx="4" fill="#222"/>
  <text x="767" y="540" class="tag" text-anchor="middle">GND</text>
  <path class="stub" stroke="#d62828" d="M685,565 H742"/>
  <rect x="742" y="555" width="44" height="20" rx="4" fill="#d62828"/>
  <text x="764" y="570" class="tag" text-anchor="middle">5V</text>
  <text x="800" y="556" class="n">je 2 Drähte</text>

  <!-- ================= Hinweise ================= -->
  <rect x="600" y="668" width="340" height="104" rx="6" fill="#f5f5f5" stroke="#ddd"/>
  <text x="612" y="688" class="n">• Gleiche Marke = verbinden (alle 5V, alle GND).</text>
  <text x="612" y="706" class="n">• Gleiche GPIOs wie beim SuperMini, gleiche Firmware.</text>
  <text x="612" y="724" class="n">• Anders als beim SuperMini: 5V/GND und GPIO6</text>
  <text x="622" y="740" class="n">rechts, GPIO7/8/9 links.</text>
  <text x="612" y="758" class="n">• Pads 14–16 und Rückseite (17, 18, 38–45) frei.</text>
</svg>
