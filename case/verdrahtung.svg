<svg xmlns="http://www.w3.org/2000/svg" width="960" height="680" viewBox="0 0 960 680" font-family="Helvetica, Arial, sans-serif">
  <style>
    .t   { font-size: 14px; fill: #222; }
    .h   { font-size: 15px; font-weight: bold; fill: #222; }
    .pin { font-size: 12px; fill: #fff; }
    .use { font-size: 12px; fill: #fff; font-weight: bold; }
    .off { font-size: 11px; fill: #999; }
    .n   { font-size: 12.5px; fill: #333; }
    .w   { fill: none; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    .stub{ fill: none; stroke-width: 3; stroke-linecap: round; }
  </style>
  <rect width="960" height="680" fill="#ffffff"/>

  <text x="30" y="38" font-size="20" font-weight="bold" fill="#222">Verdrahtung: LD2450 + LD2410C → ESP32-S3 SuperMini</text>
  <text x="30" y="60" class="t">Radare: Ansicht von hinten (Lötseite). ESP: Bauteilseite, USB-C oben (so wie auf den Produktfotos).</text>

  <!-- ========== LD2450 (Rückseite) ========== -->
  <text x="60" y="102" class="h">HLK-LD2450 – Rückseite</text>
  <rect x="60" y="110" width="360" height="124" rx="6" fill="#1f5fa8"/>
  <rect x="66" y="150" width="22" height="44" rx="2" fill="#f0f0f0"/>
  <text x="96" y="176" class="pin">JST-Buchse (nicht nötig)</text>
  <rect x="345" y="128" width="70" height="104" rx="3" fill="#222"/>
  <!-- linke Spalte -->
  <circle cx="362" cy="145" r="6" fill="#d4af37"/>
  <circle cx="362" cy="170" r="6" fill="#d4af37"/>
  <circle cx="362" cy="195" r="6" fill="#d4af37"/>
  <circle cx="362" cy="220" r="6" fill="#d4af37"/>
  <text x="338" y="149" class="use" text-anchor="end">5V</text>
  <text x="338" y="174" class="pin" text-anchor="end" opacity="0.6">3.3V</text>
  <text x="338" y="199" class="pin" text-anchor="end" opacity="0.6">PA9</text>
  <text x="338" y="224" class="use" text-anchor="end">GND</text>
  <!-- rechte Spalte -->
  <circle cx="398" cy="145" r="6" fill="#d4af37"/>
  <circle cx="398" cy="170" r="6" fill="#d4af37"/>
  <circle cx="398" cy="195" r="6" fill="#d4af37"/>
  <circle cx="398" cy="220" r="6" fill="#d4af37"/>
  <text x="430" y="199" class="off">DP  frei</text>
  <text x="430" y="224" class="off">DM  frei</text>
  <text x="60" y="252" class="n">2×4-Stiftleiste (2,0 mm), Pins auf ~3 mm kürzen</text>

  <!-- ========== LD2410C (Rückseite) ========== -->
  <rect x="120" y="440" width="240" height="175" rx="8" fill="#1f5fa8"/>
  <circle cx="165" cy="460" r="6" fill="#d4af37"/>
  <circle cx="205" cy="460" r="6" fill="#d4af37"/>
  <circle cx="245" cy="460" r="6" fill="#d4af37"/>
  <circle cx="285" cy="460" r="6" fill="#d4af37"/>
  <circle cx="325" cy="460" r="6" fill="#d4af37"/>
  <text x="165" y="488" class="use" text-anchor="middle">VCC</text>
  <text x="205" y="488" class="use" text-anchor="middle">GND</text>
  <text x="245" y="488" class="pin" text-anchor="middle" opacity="0.6">OUT</text>
  <text x="285" y="488" class="use" text-anchor="middle">RX</text>
  <text x="325" y="488" class="use" text-anchor="middle">TX</text>
  <text x="240" y="540" class="pin" text-anchor="middle">Stiftleiste ausgelötet,</text>
  <text x="240" y="557" class="pin" text-anchor="middle">Litzen direkt in die Löcher</text>
  <text x="240" y="590" class="pin" text-anchor="middle" opacity="0.8">vorne bedruckt: TX RX OUT GND VCC</text>
  <text x="240" y="606" class="pin" text-anchor="middle" opacity="0.8">→ von hinten gespiegelt!</text>
  <text x="120" y="638" class="h">HLK-LD2410C – Rückseite</text>
  <text x="245" y="430" class="off" text-anchor="middle">OUT frei</text>

  <!-- ========== ESP32-S3 SuperMini ========== -->
  <rect x="600" y="170" width="180" height="300" rx="8" fill="#151515"/>
  <rect x="650" y="150" width="80" height="34" rx="7" fill="#b9b9b9"/>
  <text x="690" y="172" font-size="12" fill="#222" text-anchor="middle">USB-C</text>
  <!-- linke Spalte: TX(43) RX(44) 1..7 -->
  <g fill="#d4af37">
    <circle cx="615" cy="200" r="6"/><circle cx="615" cy="230" r="6"/><circle cx="615" cy="260" r="6"/>
    <circle cx="615" cy="290" r="6"/><circle cx="615" cy="320" r="6"/><circle cx="615" cy="350" r="6"/>
    <circle cx="615" cy="380" r="6"/><circle cx="615" cy="410" r="6"/><circle cx="615" cy="440" r="6"/>
    <circle cx="765" cy="200" r="6"/><circle cx="765" cy="230" r="6"/><circle cx="765" cy="260" r="6"/>
    <circle cx="765" cy="290" r="6"/><circle cx="765" cy="320" r="6"/><circle cx="765" cy="350" r="6"/>
    <circle cx="765" cy="380" r="6"/><circle cx="765" cy="410" r="6"/><circle cx="765" cy="440" r="6"/>
  </g>
  <text x="630" y="204" class="pin" opacity="0.6">TX (43)</text>
  <text x="630" y="234" class="pin" opacity="0.6">RX (44)</text>
  <text x="630" y="264" class="use">GPIO1</text>
  <text x="630" y="294" class="use">GPIO2</text>
  <text x="630" y="324" class="pin" opacity="0.6">3  (frei lassen)</text>
  <text x="630" y="354" class="use">GPIO4</text>
  <text x="630" y="384" class="use">GPIO5</text>
  <text x="630" y="414" class="pin" opacity="0.6">6</text>
  <text x="630" y="444" class="pin" opacity="0.6">7</text>
  <text x="750" y="204" class="use" text-anchor="end">5V</text>
  <text x="750" y="234" class="use" text-anchor="end">GND</text>
  <text x="750" y="264" class="pin" text-anchor="end" opacity="0.6">3V3</text>
  <text x="750" y="294" class="pin" text-anchor="end" opacity="0.6">13</text>
  <text x="750" y="324" class="pin" text-anchor="end" opacity="0.6">12</text>
  <text x="750" y="354" class="pin" text-anchor="end" opacity="0.6">11</text>
  <text x="750" y="384" class="pin" text-anchor="end" opacity="0.6">10</text>
  <text x="750" y="414" class="pin" text-anchor="end" opacity="0.6">9</text>
  <text x="750" y="444" class="pin" text-anchor="end" opacity="0.6">8</text>
  <text x="600" y="496" class="h">ESP32-S3 SuperMini – Bauteilseite</text>

  <!-- ========== Signalleitungen ========== -->
  <!-- LD2450 RX  <- GPIO1 (ESP TX) -->
  <path class="w" stroke="#2e9e44" d="M398,145 H540 V260 H615"/>
  <!-- LD2450 TX  -> GPIO2 (ESP RX) -->
  <path class="w" stroke="#e8890c" d="M398,170 H520 V290 H615"/>
  <!-- LD2410C RX <- GPIO4 (ESP TX) -->
  <path class="w" stroke="#2f6fe0" d="M285,460 V350 H615"/>
  <!-- LD2410C TX -> GPIO5 (ESP RX) -->
  <path class="w" stroke="#a03fc8" d="M325,460 V380 H615"/>
  <text x="428" y="139" class="n" fill="#2e9e44">RX ← GPIO1</text>
  <text x="428" y="164" class="n" fill="#e8890c">TX → GPIO2</text>
  <text x="395" y="344" class="n" fill="#2f6fe0">RX ← GPIO4</text>
  <text x="395" y="374" class="n" fill="#a03fc8">TX → GPIO5</text>

  <!-- ========== Versorgung als Netz-Marken ========== -->
  <!-- LD2450 5V / GND -->
  <path class="stub" stroke="#d62828" d="M362,145 V88"/>
  <rect x="340" y="70" width="44" height="20" rx="4" fill="#d62828"/>
  <text x="362" y="85" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">5V</text>
  <path class="stub" stroke="#222" d="M362,220 V262"/>
  <rect x="337" y="262" width="50" height="20" rx="4" fill="#222"/>
  <text x="362" y="277" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">GND</text>
  <!-- LD2410C VCC / GND -->
  <path class="stub" stroke="#d62828" d="M165,460 V412"/>
  <rect x="143" y="394" width="44" height="20" rx="4" fill="#d62828"/>
  <text x="165" y="409" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">5V</text>
  <path class="stub" stroke="#222" d="M205,460 V412"/>
  <rect x="190" y="394" width="50" height="20" rx="4" fill="#222"/>
  <text x="215" y="409" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">GND</text>
  <!-- ESP 5V / GND -->
  <path class="stub" stroke="#d62828" d="M765,200 H822"/>
  <rect x="822" y="190" width="44" height="20" rx="4" fill="#d62828"/>
  <text x="844" y="205" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">5V</text>
  <path class="stub" stroke="#222" d="M765,230 H822"/>
  <rect x="822" y="220" width="50" height="20" rx="4" fill="#222"/>
  <text x="847" y="235" font-size="13" font-weight="bold" fill="#fff" text-anchor="middle">GND</text>
  <text x="822" y="262" class="n">je 2 Drähte</text>
  <text x="822" y="278" class="n">(zu beiden Radaren)</text>

  <!-- ========== Hinweise ========== -->
  <rect x="600" y="515" width="335" height="140" rx="6" fill="#f5f5f5" stroke="#ddd"/>
  <text x="614" y="538" class="n" font-weight="bold">Hinweise</text>
  <text x="614" y="560" class="n">• Gleiche Marke = verbinden (alle 5V, alle GND).</text>
  <text x="614" y="580" class="n">• Radar-TX → ESP-RX, Radar-RX ← ESP-TX.</text>
  <text x="614" y="600" class="n">• LD2450-Belegung laut Datenblatt: vor dem</text>
  <text x="624" y="616" class="n">Löten mit dem Aufdruck vergleichen.</text>
  <text x="614" y="636" class="n">• Beide Radare: UART 256000 Baud, 3,3-V-Pegel.</text>
</svg>
