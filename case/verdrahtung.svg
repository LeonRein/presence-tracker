<svg xmlns="http://www.w3.org/2000/svg" width="960" height="720" viewBox="0 0 960 720" font-family="Helvetica, Arial, sans-serif">
  <style>
    .t   { font-size: 14px; fill: #222; }
    .h   { font-size: 15px; font-weight: bold; fill: #222; }
    .pin { font-size: 12px; fill: #fff; }
    .use { font-size: 12px; fill: #fff; font-weight: bold; }
    .off { font-size: 11px; fill: #999; }
    .n   { font-size: 12.5px; fill: #333; }
    .w   { fill: none; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
    .stub{ fill: none; stroke-width: 3; stroke-linecap: round; }
    .tag { font-size: 13px; font-weight: bold; fill: #fff; }
  </style>
  <rect width="960" height="720" fill="#ffffff"/>

  <text x="30" y="36" font-size="20" font-weight="bold" fill="#222">Verdrahtung: LD2450 + LD2410C → ESP32-S3 SuperMini</text>
  <text x="30" y="58" class="t">Alles von vorne gesehen, so wie es im Gehäuse eingebaut ist (ESP: Bauteilseite nach vorne, USB-C unten).</text>

  <!-- ================= LD2450 (Vorderseite, Buchse hinten) ================= -->
  <text x="80" y="102" class="h">HLK-LD2450 – Vorderseite</text>
  <rect x="80" y="110" width="680" height="124" rx="8" fill="#1f5fa8"/>
  <!-- Antennen nur angedeutet -->
  <g fill="#c9a43a" opacity="0.35">
    <rect x="330" y="135" width="46" height="34" rx="3"/><rect x="400" y="135" width="46" height="34" rx="3"/>
    <rect x="470" y="135" width="46" height="34" rx="3"/><rect x="540" y="135" width="46" height="34" rx="3"/>
    <rect x="470" y="180" width="46" height="34" rx="3"/><rect x="540" y="180" width="46" height="34" rx="3"/>
  </g>
  <!-- Stiftleiste auf der Rückseite (links von vorne gesehen) -->
  <rect x="100" y="128" width="66" height="96" rx="3" fill="none" stroke="#fff" stroke-dasharray="4 3" opacity="0.6"/>
  <text x="176" y="160" class="pin" opacity="0.75">Stiftleiste (hinten)</text>
  <text x="176" y="176" class="pin" opacity="0.75">bleibt ungenutzt</text>
  <!-- JST-Buchse auf der Rückseite (rechts von vorne gesehen) -->
  <rect x="722" y="132" width="32" height="80" rx="3" fill="#f0f0f0" opacity="0.9" stroke="#999" stroke-dasharray="4 3"/>
  <circle cx="738" cy="145" r="5" fill="#d4af37"/>
  <circle cx="738" cy="165" r="5" fill="#d4af37"/>
  <circle cx="738" cy="185" r="5" fill="#d4af37"/>
  <circle cx="738" cy="205" r="5" fill="#d4af37"/>
  <text x="714" y="149" class="use" text-anchor="end">5V</text>
  <text x="714" y="169" class="use" text-anchor="end">RX</text>
  <text x="714" y="189" class="use" text-anchor="end">TX</text>
  <text x="714" y="209" class="use" text-anchor="end">GND</text>
  <text x="620" y="226" class="pin" opacity="0.75" text-anchor="end">JST-Buchse (hinten)</text>

  <!-- ================= ESP32-S3 SuperMini (USB-C unten) ================= -->
  <rect x="520" y="265" width="180" height="290" rx="8" fill="#151515"/>
  <rect x="570" y="540" width="80" height="34" rx="7" fill="#b9b9b9"/>
  <text x="610" y="562" font-size="12" fill="#222" text-anchor="middle">USB-C</text>
  <g fill="#d4af37">
    <circle cx="535" cy="290" r="6"/><circle cx="535" cy="320" r="6"/><circle cx="535" cy="350" r="6"/>
    <circle cx="535" cy="380" r="6"/><circle cx="535" cy="410" r="6"/><circle cx="535" cy="440" r="6"/>
    <circle cx="535" cy="470" r="6"/><circle cx="535" cy="500" r="6"/><circle cx="535" cy="530" r="6"/>
    <circle cx="685" cy="290" r="6"/><circle cx="685" cy="320" r="6"/><circle cx="685" cy="350" r="6"/>
    <circle cx="685" cy="380" r="6"/><circle cx="685" cy="410" r="6"/><circle cx="685" cy="440" r="6"/>
    <circle cx="685" cy="470" r="6"/><circle cx="685" cy="500" r="6"/><circle cx="685" cy="530" r="6"/>
  </g>
  <!-- linke Spalte (von oben): 8 9 10 11 12 13 3V3 GND 5V -->
  <text x="550" y="294" class="use">GPIO8</text>
  <text x="550" y="324" class="use">GPIO9</text>
  <text x="550" y="354" class="pin" opacity="0.6">10</text>
  <text x="550" y="384" class="pin" opacity="0.6">11</text>
  <text x="550" y="414" class="pin" opacity="0.6">12</text>
  <text x="550" y="444" class="pin" opacity="0.6">13</text>
  <text x="550" y="474" class="pin" opacity="0.6">3V3</text>
  <text x="550" y="504" class="use">GND</text>
  <text x="550" y="534" class="use">5V</text>
  <!-- rechte Spalte (von oben): 7 6 5 4 3 2 1 RX TX -->
  <text x="670" y="294" class="use" text-anchor="end">GPIO7</text>
  <text x="670" y="324" class="use" text-anchor="end">GPIO6</text>
  <text x="670" y="354" class="pin" text-anchor="end" opacity="0.6">5</text>
  <text x="670" y="384" class="pin" text-anchor="end" opacity="0.6">4</text>
  <text x="670" y="414" class="pin" text-anchor="end" opacity="0.6">3 (frei lassen)</text>
  <text x="670" y="444" class="pin" text-anchor="end" opacity="0.6">2</text>
  <text x="670" y="474" class="pin" text-anchor="end" opacity="0.6">1</text>
  <text x="670" y="504" class="pin" text-anchor="end" opacity="0.6">RX (44)</text>
  <text x="670" y="534" class="pin" text-anchor="end" opacity="0.6">TX (43)</text>
  <text x="520" y="598" class="h">ESP32-S3 SuperMini</text>
  <text x="520" y="616" class="n">Bauteilseite, USB-C unten</text>

  <!-- ================= LD2410C (Vorderseite) ================= -->
  <rect x="120" y="470" width="240" height="160" rx="8" fill="#1f5fa8"/>
  <circle cx="165" cy="490" r="6" fill="#d4af37"/>
  <circle cx="205" cy="490" r="6" fill="#d4af37"/>
  <circle cx="245" cy="490" r="6" fill="#d4af37"/>
  <circle cx="285" cy="490" r="6" fill="#d4af37"/>
  <circle cx="325" cy="490" r="6" fill="#d4af37"/>
  <text x="165" y="517" class="use" text-anchor="middle">TX</text>
  <text x="205" y="517" class="use" text-anchor="middle">RX</text>
  <text x="245" y="517" class="pin" text-anchor="middle" opacity="0.6">OUT</text>
  <text x="285" y="517" class="use" text-anchor="middle">GND</text>
  <text x="325" y="517" class="use" text-anchor="middle">VCC</text>
  <g fill="#c9a43a" opacity="0.35"><rect x="160" y="535" width="44" height="40" rx="3"/><rect x="280" y="535" width="44" height="40" rx="3"/></g>
  <text x="240" y="598" class="pin" text-anchor="middle">Stiftleiste auslöten, Litzen</text>
  <text x="240" y="614" class="pin" text-anchor="middle">von hinten in die Löcher löten</text>
  <text x="120" y="652" class="h">HLK-LD2410C – Vorderseite</text>
  <text x="120" y="670" class="n">(Lötseite hinten: Reihenfolge gespiegelt, VCC · GND · OUT · RX · TX)</text>

  <!-- ================= Signalleitungen ================= -->
  <!-- LD2450 RX <- GPIO6 (ESP sendet) -->
  <path class="w" stroke="#2e9e44" d="M738,165 H812 V320 H685"/>
  <!-- LD2450 TX -> GPIO7 (ESP empfängt) -->
  <path class="w" stroke="#e8890c" d="M738,185 H795 V290 H685"/>
  <!-- LD2410C TX -> GPIO8 (ESP empfängt) -->
  <path class="w" stroke="#a03fc8" d="M165,490 V290 H535"/>
  <!-- LD2410C RX <- GPIO9 (ESP sendet) -->
  <path class="w" stroke="#2f6fe0" d="M205,490 V320 H535"/>
  <text x="822" y="275" class="n" fill="#e8890c">TX → GPIO7</text>
  <text x="822" y="340" class="n" fill="#2e9e44">RX ← GPIO6</text>
  <text x="300" y="284" class="n" fill="#a03fc8">TX → GPIO8</text>
  <text x="300" y="314" class="n" fill="#2f6fe0">RX ← GPIO9</text>

  <!-- ================= Versorgung (Netz-Marken) ================= -->
  <!-- LD2450 JST 5V / GND -->
  <path class="stub" stroke="#d62828" d="M738,145 V88"/>
  <rect x="716" y="70" width="44" height="20" rx="4" fill="#d62828"/>
  <text x="738" y="85" class="tag" text-anchor="middle">5V</text>
  <path class="stub" stroke="#222" d="M738,205 V252"/>
  <rect x="713" y="248" width="50" height="20" rx="4" fill="#222"/>
  <text x="738" y="263" class="tag" text-anchor="middle">GND</text>
  <!-- LD2410C GND / VCC -->
  <path class="stub" stroke="#222" d="M285,490 V448"/>
  <rect x="260" y="430" width="50" height="20" rx="4" fill="#222"/>
  <text x="285" y="445" class="tag" text-anchor="middle">GND</text>
  <path class="stub" stroke="#d62828" d="M325,490 V448"/>
  <rect x="315" y="406" width="44" height="20" rx="4" fill="#d62828"/>
  <path class="stub" stroke="#d62828" d="M325,448 V426"/>
  <text x="337" y="421" class="tag" text-anchor="middle">5V</text>
  <text x="245" y="462" class="off" text-anchor="middle">OUT frei</text>
  <!-- ESP 5V / GND -->
  <path class="stub" stroke="#222" d="M535,500 H478"/>
  <rect x="428" y="490" width="50" height="20" rx="4" fill="#222"/>
  <text x="453" y="505" class="tag" text-anchor="middle">GND</text>
  <path class="stub" stroke="#d62828" d="M535,530 H478"/>
  <rect x="434" y="520" width="44" height="20" rx="4" fill="#d62828"/>
  <text x="456" y="535" class="tag" text-anchor="middle">5V</text>
  <text x="400" y="560" class="n" text-anchor="start">je 2 Drähte</text>

  <!-- ================= Hinweise ================= -->
  <rect x="610" y="630" width="330" height="80" rx="6" fill="#f5f5f5" stroke="#ddd"/>
  <text x="622" y="650" class="n">• Gleiche Marke = verbinden (alle 5V, alle GND).</text>
  <text x="622" y="668" class="n">• JST-ZH (1,5 mm): nach Position anschließen,</text>
  <text x="632" y="684" class="n">die Kabelfarben sind nicht genormt.</text>
  <text x="622" y="702" class="n">• Beide Radare: UART 256000 Baud, 3,3-V-Pegel.</text>
</svg>
