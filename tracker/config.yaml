name: Presence Tracker
version: "0.9.2"
slug: presence_tracker
description: Verfolgt Personen über mehrere LD2450/LD2410C-Radarsensoren und meldet belegte Zonen an Home Assistant
url: https://github.com/LeonRein/presence-tracker/tree/main/tracker
arch:
  - amd64
  - aarch64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:radar
panel_title: Präsenz
homeassistant_api: true
services:
  - mqtt:need
options:
  log_level: info
  topic_prefix: presence
schema:
  log_level: list(debug|info|warning|error)
  topic_prefix: str
