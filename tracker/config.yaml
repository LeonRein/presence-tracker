name: Presence Tracker
version: "0.64.0"
image: "ghcr.io/leonrein/{arch}-presence-tracker"
slug: presence_tracker
description: Verfolgt Personen über mehrere LD2450/LD2410C-Radarsensoren und meldet belegte Zonen an Home Assistant
url: https://github.com/LeonRein/presence-tracker/tree/main/tracker
arch:
  - amd64
  - aarch64
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:radar
panel_title: Präsenz
panel_admin: false
homeassistant_api: true
backup_exclude:
  - recordings/*
services:
  - mqtt:need
options:
  log_level: info
  topic_prefix: presence
schema:
  log_level: list(debug|info|warning|error)
  topic_prefix: str
