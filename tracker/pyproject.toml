[project]
name = "presence-tracker"
version = "0.1.0"
description = "Multi-sensor radar presence tracker for Home Assistant"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "aiomqtt>=2.3",
    "aiohttp>=3.10",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
