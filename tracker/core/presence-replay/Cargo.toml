[package]
name = "presence-replay"
version = "0.1.0"
description = "Replays a recording through presence-core without Python (docs/rust-core.md 6): trace, prof, bench (Prüfstand)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
presence-core = { path = "../presence-core" }
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
libc = "0.2"

[lints]
workspace = true
