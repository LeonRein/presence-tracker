[package]
name = "presence-core"
version = "0.1.0"
description = "The Bayes filter of the presence tracker (MODEL.md), a pure core without I/O"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
faer = { version = "0.24", default-features = false, features = ["std"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
libm = "0.2"

[dev-dependencies]
flate2 = "1"
matrixmultiply = "0.3"

[lints]
workspace = true
