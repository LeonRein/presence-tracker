[build-system]
requires = ["maturin>=1.15,<2"]
build-backend = "maturin"

[project]
name = "presence-core"
description = "The Bayes filter of the presence tracker in Rust (module presence_core)"
requires-python = ">=3.13"
dependencies = []
dynamic = ["version"]

[project.optional-dependencies]
# the test hooks (feature "testing") give numpy arrays; the release wheel needs nothing
testing = ["numpy>=2.0"]

[tool.maturin]
module-name = "presence_core"
features = ["pyo3/extension-module"]
