[package]
name = "presence-py"
version = "0.1.0"
description = "Python bindings of presence-core (module presence_core)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "presence_core"
crate-type = ["cdylib"]

[dependencies]
presence-core = { path = "../presence-core" }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py313"] }
numpy = { version = "0.30", optional = true }
serde_json = "1"

[features]
# hooks for the shell's tests only (normalize, spoil_weights_for_test, ld_last, panic_for_test, build_export,
# hidden_at): never in the image
testing = ["presence-core/testing", "dep:numpy"]

[lints]
workspace = true
