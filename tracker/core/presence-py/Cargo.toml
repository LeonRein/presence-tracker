[package]
name = "presence-py"
version = "0.1.0"
description = "Python bindings of presence-core (module presence_core)"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "presence_core"
crate-type = ["cdylib"]

[dependencies]
presence-core = { path = "../presence-core" }
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py313"] }
numpy = { version = "0.30", optional = true }
serde_json = "1"

[build-dependencies]
sha1_smol = "1"

[features]
# the hooks of the shell's tests and the tools (docs/rust-core.md 4: Core.normalize, spoil_weights_for_test,
# ld_last, the readings of the filter's state and outputs, model_defaults, ld_prior, ld_expected,
# panic_for_test, build_export, hidden_at, Geometry): never in the image
testing = ["presence-core/testing", "dep:numpy"]

[lints]
workspace = true
