[workspace]
resolver = "3"
members = ["presence-core", "presence-py"]

[workspace.package]
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.lints.clippy]
redundant_clone = "warn"
needless_pass_by_value = "warn"
# `!(x > 0.0)` on purpose: NaN counts as "not positive", as `not x > 0` in the Python filter did
neg_cmp_op_on_partial_ord = "allow"

[profile.release]
codegen-units = 1
lto = "fat"
debug = "line-tables-only"  # py-spy -n shows the Rust frames
